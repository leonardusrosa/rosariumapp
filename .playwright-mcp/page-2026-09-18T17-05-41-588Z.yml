          - generic [ref=f4e110]:
            - generic [ref=f4e114]:
              - heading "Signum Crucis" [level=2] [ref=f4e116] [cursor=pointer]
              - generic [ref=f4e124]:
                - generic [ref=f4e125]: Per signum crucis de inimicis nostris libera nos Deus noster. In nomine Patris, et Filii, et Spiritus Sancti. Amen.
                - generic [ref=f4e128]: Pelo sinal da Santa Cruz, livrai-nos Deus, Nosso Senhor, dos nossos inimigos. Em nome do Pai e do Filho e do Espírito Santo. Amém.
            - generic [ref=f4e134]:
              - heading " Offertorium Rosarii" [level=2] [ref=f4e136] [cursor=pointer]:
                - generic [ref=f4e137]: 
                - generic [ref=f4e138]: Offertorium Rosarii
              - generic [ref=f4e143]:
                - generic [ref=f4e144]: Divino Iesu, nos Tibi offerimus hoc rosarium, quod recitaturi sumus, mysteria nostrae Redemptionis meditantes. Concede nobis, per intercessionem Virginis Mariae, Dei Genetricis et Matris nostrae, virtutes quibus opus est ut digne illud recitemus, atque gratiam indulgentias huius sanctae devotionis obtinendi. Particulariter offerimus in reparationem peccatorum contra Sacratissimum Cor Iesu et Immaculatum Cor Mariae commissorum, pro pace mundi, pro conversione peccatorum, pro animabus in Purgatorio, pro intentionibus Summi Pontificis, pro incremento et sanctificatione Cleri, pro reditu Cleri et fidelium ad traditionem, pro sanctificatione familiarum, pro missionibus, pro aegrotis, pro agonizantibus, pro omnibus qui preces nostras petierunt, pro patria nostra et pro omnibus intentionibus nostris particularibus.
                - generic [ref=f4e147]: Divino Jesus, nós Vos oferecemos este terço que vamos rezar, meditando nos mistérios da Vossa Redenção. Concedei-nos, por intercessão da Virgem Maria, Mãe de Deus e nossa Mãe, as virtudes que nos são necessárias para bem rezá-lo e a graça de ganharmos as indulgências desta santa devoção. Oferecemos particularmente, em desagravo dos pecados cometidos contra o Santíssimo Coração de Jesus e Imaculado Coração de Maria, pela paz do mundo, pela conversão dos pecadores, pelas almas do Purgatório, pelas intenções do Santo Padre, pelo aumento e santificação do Clero, pelo retorno dos fiéis à tradição, pela santificação das famílias, pelas missões, pelos doentes, pelos agonizantes, por todos aqueles que pediram nossas orações, pelo nosso país e por todas as nossas intenções particulares.
            - generic [ref=f4e153]:
              - heading "Oratio ad Angelum Custodem" [level=2] [ref=f4e155] [cursor=pointer]
              - generic [ref=f4e165]:
                - generic [ref=f4e166]: Sancte Angele Custos, cum omni amore et fiducia, Te rogamus ut adsistas et juncti nobiscum hoc rosarium recites, ut orationes nostrae efficaciores sint et semper in unione cum Deo maneamus. Amen.
                - generic [ref=f4e169]: Santo Anjo da Guarda, com todo amor e confiança, Vos pedimos para que estejais conosco rezando este terço, para que nossas orações sejam mais eficazes e que estejamos sempre em união com Deus. Amém.
            - generic [ref=f4e175]:
              - heading " Invocatio Sancti Spiritus" [level=2] [ref=f4e177] [cursor=pointer]:
                - generic [ref=f4e178]: 
                - generic [ref=f4e179]: Invocatio Sancti Spiritus
              - generic [ref=f4e184]:
                - generic [ref=f4e185]: "Veni, Sancte Spiritus, reple tuorum corda fidelium, et tui amoris in eis ignem accende. V. Emítte Spíritum tuum, et creabúntur. R. Et renovábis fáciem terrae. Oremus: Deus qui corda fidélium Sancti Spíritus illustratióne docuísti: da nobis in eódem Spíritu recta sápere; et de ejus semper consolatióne gaudére. Per Christum Dominum Nostrum. Amen."
                - generic [ref=f4e188]: "Vinde Espírito Santo, enchei os corações dos vossos fiéis e acendei neles o fogo do Vosso amor. V. Enviai o Vosso Espírito e tudo será criado. R. E renovareis a face da terra. Oremos: Deus, que instruístes os corações dos vossos fiéis com a luz do Espírito Santo, concedei-nos que no mesmo Espírito conheçamos o que é reto, e gozemos sempre de suas consolações. Por Cristo, Nosso Senhor. Amém."
            - generic [ref=f4e194]:
              - heading " Oratio pro Matrimonio et Filiis" [level=2] [ref=f4e196] [cursor=pointer]:
                - generic [ref=f4e197]: 
                - generic [ref=f4e198]: Oratio pro Matrimonio et Filiis
              - generic [ref=f4e203]:
                - generic [ref=f4e204]: Amate Iesu, Rex Regum, cor nostrum et vitam nostram amatoriam ante Te ponimus. Dirige nos ad vivendum relationem secundum voluntatem Tuam, cum fidelitate, respectu et mutua donatione, ut sit via incrementi in fide et sanctitate. Sancte Valentine, patrone veri amoris, intercede pro nobis et doce nos patienter alterius defectus accipere, virtutem veniae et comprehensionis colentes. Adiuva nos ad construendum amorem solidum, qui probationibus resistere possit et semper in Christo radicitus sit. Gloriose Archangele Raphael, tu es fidelis dux eorum qui relationem secundum voluntatem Dei quaerunt. Nos in hoc itinere comitare, ducens nos ad aliquem qui vere Deum amet et sanctum matrimonium vivere velit. Illumina mentem nostram ut sapientes electiones faciamus, cor nostrum confirma ne fallamur amoribus transitoriis et doce nos patienter in Domino sperare. Domine, si voluntas Tua est, concede nobis gratiam matrimonii, et para nos ad liberos quos nobis committere volueris cum gaudio recipiendos. Ut a matris utero sani sint in corpore et anima, crescentes in amore Tuo et sub protectione Sacrae Familiae. Sancte Ioseph, ora pro nobis! Sancte Valentine, ora pro nobis! Sancte Raphael, ora pro nobis! Sacra Familia, protege nos! Amen.
                - generic [ref=f4e207]: Amado Jesus, Rei dos Reis, diante de Vós colocamos nossos corações e nossas vidas amorosas. Guiai-nos para viver um relacionamento conforme a Vossa vontade, com fidelidade, respeito e doação mútua, para que seja um caminho de crescimento na fé e na santidade. São Valentim, patrono do amor verdadeiro, intercedei por nós e ensinai-nos a aceitar com paciência as falhas um do outro, cultivando a virtude do perdão e da compreensão. Ajudai-nos a construir um amor sólido, capaz de resistir às provações e sempre enraizado em Cristo. Glorioso Arcanjo São Rafael, tu és o fiel guia dos que buscam um relacionamento segundo a vontade de Deus. Acompanhe-nos nessa jornada, conduzindo-nos a alguém que verdadeiramente ame a Deus e queira viver um santo matrimônio. Ilumina nossa mente para que façamos escolhas sábias, fortalecendo nosso coração para que não nos iludamos com amores passageiros e ensina-nos a esperar com paciência no Senhor. Senhor, se for da Vossa vontade, concedei-nos a graça do matrimônio, e preparai-nos para receber com alegria os filhos que nos quiserdes confiar. Que desde o ventre materno sejam saudáveis no corpo e na alma, crescendo no Vosso amor e sob a proteção da Sagrada Família. São José, rogai por nós. São Valentim, rogai por nós! São Rafael, rogai por nós! Sagrada Família, protegei-nos! Amém.
            - generic [ref=f4e213]:
              - heading " Credo" [level=2] [ref=f4e215] [cursor=pointer]:
                - generic [ref=f4e216]: 
                - generic [ref=f4e217]: Credo
              - generic [ref=f4e222]:
                - generic [ref=f4e223]: "Credo in unum Deum, Patrem omnipoténtem, Factórem caeli et terrae, visibílium ómnium et invisibílium. Et in unum Dóminum, Iesum Christum, Fílium Dei Unigénitum, et ex Patre natum ante ómnia saecula. Deum de Deo, lumen de lúmine, Deum verum de Deo vero, génitum, non factum, consubstantiálem Patri. Per quem ómnia facta sunt. Qui propter nos hómines, et propter nostram salútem, descéndit de caelis: Et incarnátus est de Spíritu Sancto, ex María Vírgine, et homo factus est. Crucifíxus étiam pro nobis sub Póntio Piláto; passus et sepúltus est. Et resurréxit tértia die, secúndum Scriptúras, et ascéndit in caelum, sedet ad déxteram Patris. Et íterum ventúrus est cum glória, iudicáre vivos et mórtuos, cuius regni non erit finis. Et in Spíritum Sanctum, Dóminum et vivificántem, qui ex Patre Filióque procédit; Qui cum Patre et Fílio simul adorátur et conglorificátur: Qui locútus est per prophétas. Et unam, sanctam, cathólicam et apostólicam Ecclésiam. Confíteor unum baptísma in remissiónem peccatorum. Et expecto resurrectionem mortuorum; Et vitam ventúri saeculi. Amen."
                - generic [ref=f4e226]: "Creio em um só Deus, Pai todo-poderoso, Criador do céu e da terra, de todas as coisas visíveis e invisíveis. Creio em um só Senhor, Jesus Cristo, Filho Unigénito de Deus, nascido do Pai antes de todos os séculos. Deus de Deus, luz da luz, Deus verdadeiro de Deus verdadeiro, gerado, não criado, consubstancial ao Pai. Por Ele todas as coisas foram feitas. E, por nós, homens, e para a nossa salvação, desceu dos céus: E se encarnou pelo Espírito Santo, no seio da Virgem Maria, e se fez homem. Também por nós foi crucificado sob Pôncio Pilatos; padeceu e foi sepultado. Ressuscitou ao terceiro dia, conforme as Escrituras, e subiu aos céus, onde está sentado à direita do Pai. De novo há-de vir em sua glória para julgar os vivos e os mortos; e o seu reino não terá fim. Creio no Espírito Santo, Senhor que dá a vida, e procede do Pai e do Filho; E com o Pai e o Filho é adorado e glorificado: Ele que falou pelos profetas. Creio na Igreja una, santa, católica e apostólica. Professo um só batismo para remissão dos pecados. Espero a ressurreição dos mortos; E a vida do mundo que há de vir. Amém."
            - generic [ref=f4e232]:
              - heading "Pater Noster" [level=2] [ref=f4e234] [cursor=pointer]
              - generic [ref=f4e242]:
                - generic [ref=f4e243]: Pater noster, qui es in caelis, sanctificetur nomen tuum. Adveniat regnum tuum. Fiat voluntas tua, sicut in caelo et in terra. Panem nostrum quotidianum da nobis hodie. Et dimitte nobis debita nostra, sicut et nos dimittimus debitoribus nostris. Et ne nos inducas in tentationem, sed libera nos a malo. Amen.
                - generic [ref=f4e246]: Pai Nosso, que estais nos céus, santificado seja o vosso nome; venha a nós o vosso reino; seja feita a vossa vontade, assim na terra como no céu. O pão nosso de cada dia nos dai hoje; perdoai-nos as nossas dívidas, assim como nós perdoamos os nossos devedores; e não nos deixeis cair em tentação, mas livrai-nos do mal. Amém.
            - generic [ref=f4e252]:
              - heading "3 Ave Maria" [level=2] [ref=f4e254] [cursor=pointer]
              - generic [ref=f4e263]:
                - generic [ref=f4e264]: Ave Maria, gratia plena, Dominus tecum. Benedicta tu in mulieribus, et benedictus fructus ventris tui, Iesus. Sancta Maria, Mater Dei, ora pro nobis peccatoribus, nunc et in hora mortis nostrae. Amen.
                - generic [ref=f4e267]: Ave Maria, cheia de graça, o Senhor é convosco; bendita sois vós entre as mulheres, e bendito é o fruto do vosso ventre, Jesus. Santa Maria, Mãe de Deus, rogai por nós pecadores, agora e na hora da nossa morte. Amém.
            - generic [ref=f4e273]:
              - heading "Gloria Patri" [level=2] [ref=f4e275] [cursor=pointer]
              - generic [ref=f4e287]:
                - generic [ref=f4e288]: Gloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in saecula saeculorum. Amen.
                - generic [ref=f4e291]: Glória ao Pai, e ao Filho, e ao Espírito Santo. Como era no princípio, agora e sempre. Amém.
            - generic [ref=f4e297]:
              - heading " Oratio Fatima" [level=2] [ref=f4e299] [cursor=pointer]:
                - generic [ref=f4e300]: 
                - generic [ref=f4e301]: Oratio Fatima
              - generic [ref=f4e306]:
                - generic [ref=f4e307]: Oh Iesu mi, nos absolvi a peccátis nostris, libera nos ab ignibus infernorum. Omnes animas attrahe ad caelum, praesertim habentes maximam necessitatem. Amen.
                - generic [ref=f4e310]: Oh meu Jesus, perdoai-nos, livrai-nos do fogo do inferno, levai as almas todas para o Céu e socorrei principalmente as que mais precisarem da Vossa divine Misericórdia. Amém.
