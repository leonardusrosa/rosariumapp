        - generic [ref=f10e32]:
          - generic [ref=f10e36]:
            - heading "Signum Crucis" [level=2] [ref=f10e38] [cursor=pointer]
            - generic [ref=f10e45]:
              - generic [ref=f10e47]:
                - button "Latim" [ref=f10e48] [cursor=pointer]
                - button "Português" [ref=f10e49] [cursor=pointer]
              - generic [ref=f10e50]: Per signum crucis de inimicis nostris libera nos Deus noster. In nomine Patris, et Filii, et Spiritus Sancti. Amen.
          - generic [ref=f10e57]:
            - heading " Offertorium Rosarii" [level=2] [ref=f10e59] [cursor=pointer]:
              - generic [ref=f10e60]: 
              - generic [ref=f10e61]: Offertorium Rosarii
            - generic [ref=f10e65]:
              - generic [ref=f10e67]:
                - button "Latim" [ref=f10e68] [cursor=pointer]
                - button "Português" [ref=f10e69] [cursor=pointer]
              - generic [ref=f10e70]: Divino Iesu, nos Tibi offerimus hoc rosarium, quod recitaturi sumus, mysteria nostrae Redemptionis meditantes. Concede nobis, per intercessionem Virginis Mariae, Dei Genetricis et Matris nostrae, virtutes quibus opus est ut digne illud recitemus, atque gratiam indulgentias huius sanctae devotionis obtinendi. Particulariter offerimus in reparationem peccatorum contra Sacratissimum Cor Iesu et Immaculatum Cor Mariae commissorum, pro pace mundi, pro conversione peccatorum, pro animabus in Purgatorio, pro intentionibus Summi Pontificis, pro incremento et sanctificatione Cleri, pro reditu Cleri et fidelium ad traditionem, pro sanctificatione familiarum, pro missionibus, pro aegrotis, pro agonizantibus, pro omnibus qui preces nostras petierunt, pro patria nostra et pro omnibus intentionibus nostris particularibus.
          - generic [ref=f10e77]:
            - heading "Oratio ad Angelum Custodem" [level=2] [ref=f10e79] [cursor=pointer]
            - generic [ref=f10e88]:
              - generic [ref=f10e90]:
                - button "Latim" [ref=f10e91] [cursor=pointer]
                - button "Português" [ref=f10e92] [cursor=pointer]
              - generic [ref=f10e93]: Sancte Angele Custos, cum omni amore et fiducia, Te rogamus ut adsistas et juncti nobiscum hoc rosarium recites, ut orationes nostrae efficaciores sint et semper in unione cum Deo maneamus. Amen.
          - generic [ref=f10e100]:
            - heading " Invocatio Sancti Spiritus" [level=2] [ref=f10e102] [cursor=pointer]:
              - generic [ref=f10e103]: 
              - generic [ref=f10e104]: Invocatio Sancti Spiritus
            - generic [ref=f10e108]:
              - generic [ref=f10e110]:
                - button "Latim" [ref=f10e111] [cursor=pointer]
                - button "Português" [ref=f10e112] [cursor=pointer]
              - generic [ref=f10e113]: "Veni, Sancte Spiritus, reple tuorum corda fidelium, et tui amoris in eis ignem accende. V. Emítte Spíritum tuum, et creabúntur. R. Et renovábis fáciem terrae. Oremus: Deus qui corda fidélium Sancti Spíritus illustratióne docuísti: da nobis in eódem Spíritu recta sápere; et de ejus semper consolatióne gaudére. Per Christum Dominum Nostrum. Amen."
          - generic [ref=f10e120]:
            - heading " Oratio pro Matrimonio et Filiis" [level=2] [ref=f10e122] [cursor=pointer]:
              - generic [ref=f10e123]: 
              - generic [ref=f10e124]: Oratio pro Matrimonio et Filiis
            - generic [ref=f10e128]:
              - generic [ref=f10e130]:
                - button "Latim" [ref=f10e131] [cursor=pointer]
                - button "Português" [ref=f10e132] [cursor=pointer]
              - generic [ref=f10e133]: Amate Iesu, Rex Regum, cor nostrum et vitam nostram amatoriam ante Te ponimus. Dirige nos ad vivendum relationem secundum voluntatem Tuam, cum fidelitate, respectu et mutua donatione, ut sit via incrementi in fide et sanctitate. Sancte Valentine, patrone veri amoris, intercede pro nobis et doce nos patienter alterius defectus accipere, virtutem veniae et comprehensionis colentes. Adiuva nos ad construendum amorem solidum, qui probationibus resistere possit et semper in Christo radicitus sit. Gloriose Archangele Raphael, tu es fidelis dux eorum qui relationem secundum voluntatem Dei quaerunt. Nos in hoc itinere comitare, ducens nos ad aliquem qui vere Deum amet et sanctum matrimonium vivere velit. Illumina mentem nostram ut sapientes electiones faciamus, cor nostrum confirma ne fallamur amoribus transitoriis et doce nos patienter in Domino sperare. Domine, si voluntas Tua est, concede nobis gratiam matrimonii, et para nos ad liberos quos nobis committere volueris cum gaudio recipiendos. Ut a matris utero sani sint in corpore et anima, crescentes in amore Tuo et sub protectione Sacrae Familiae. Sancte Ioseph, ora pro nobis! Sancte Valentine, ora pro nobis! Sancte Raphael, ora pro nobis! Sacra Familia, protege nos! Amen.
          - generic [ref=f10e140]:
            - heading " Credo" [level=2] [ref=f10e142] [cursor=pointer]:
              - generic [ref=f10e143]: 
              - generic [ref=f10e144]: Credo
            - generic [ref=f10e148]:
              - generic [ref=f10e150]:
                - button "Latim" [ref=f10e151] [cursor=pointer]
                - button "Português" [ref=f10e152] [cursor=pointer]
              - generic [ref=f10e153]: "Credo in unum Deum, Patrem omnipoténtem, Factórem caeli et terrae, visibílium ómnium et invisibílium. Et in unum Dóminum, Iesum Christum, Fílium Dei Unigénitum, et ex Patre natum ante ómnia saecula. Deum de Deo, lumen de lúmine, Deum verum de Deo vero, génitum, non factum, consubstantiálem Patri. Per quem ómnia facta sunt. Qui propter nos hómines, et propter nostram salútem, descéndit de caelis: Et incarnátus est de Spíritu Sancto, ex María Vírgine, et homo factus est. Crucifíxus étiam pro nobis sub Póntio Piláto; passus et sepúltus est. Et resurréxit tértia die, secúndum Scriptúras, et ascéndit in caelum, sedet ad déxteram Patris. Et íterum ventúrus est cum glória, iudicáre vivos et mórtuos, cuius regni non erit finis. Et in Spíritum Sanctum, Dóminum et vivificántem, qui ex Patre Filióque procédit; Qui cum Patre et Fílio simul adorátur et conglorificátur: Qui locútus est per prophétas. Et unam, sanctam, cathólicam et apostólicam Ecclésiam. Confíteor unum baptísma in remissiónem peccatorum. Et expecto resurrectionem mortuorum; Et vitam ventúri saeculi. Amen."
          - generic [ref=f10e160]:
            - heading "Pater Noster" [level=2] [ref=f10e162] [cursor=pointer]
            - generic [ref=f10e169]:
              - generic [ref=f10e171]:
                - button "Latim" [ref=f10e172] [cursor=pointer]
                - button "Português" [ref=f10e173] [cursor=pointer]
              - generic [ref=f10e174]: Pater noster, qui es in caelis, sanctificetur nomen tuum. Adveniat regnum tuum. Fiat voluntas tua, sicut in caelo et in terra. Panem nostrum quotidianum da nobis hodie. Et dimitte nobis debita nostra, sicut et nos dimittimus debitoribus nostris. Et ne nos inducas in tentationem, sed libera nos a malo. Amen.
          - generic [ref=f10e181]:
            - heading "3 Ave Maria" [level=2] [ref=f10e183] [cursor=pointer]
            - generic [ref=f10e191]:
              - generic [ref=f10e193]:
                - button "Latim" [ref=f10e194] [cursor=pointer]
                - button "Português" [ref=f10e195] [cursor=pointer]
              - generic [ref=f10e196]: Ave Maria, gratia plena, Dominus tecum. Benedicta tu in mulieribus, et benedictus fructus ventris tui, Iesus. Sancta Maria, Mater Dei, ora pro nobis peccatoribus, nunc et in hora mortis nostrae. Amen.
          - generic [ref=f10e203]:
            - heading "Gloria Patri" [level=2] [ref=f10e205] [cursor=pointer]
            - generic [ref=f10e216]:
              - generic [ref=f10e218]:
                - button "Latim" [ref=f10e219] [cursor=pointer]
                - button "Português" [ref=f10e220] [cursor=pointer]
              - generic [ref=f10e221]: Gloria Patri, et Filio, et Spiritui Sancto. Sicut erat in principio, et nunc, et semper, et in saecula saeculorum. Amen.
          - generic [ref=f10e228]:
            - heading " Oratio Fatima" [level=2] [ref=f10e230] [cursor=pointer]:
              - generic [ref=f10e231]: 
              - generic [ref=f10e232]: Oratio Fatima
            - generic [ref=f10e236]:
              - generic [ref=f10e238]:
                - button "Latim" [ref=f10e239] [cursor=pointer]
                - button "Português" [ref=f10e240] [cursor=pointer]
              - generic [ref=f10e241]: Oh Iesu mi, nos absolvi a peccátis nostris, libera nos ab ignibus infernorum. Omnes animas attrahe ad caelum, praesertim habentes maximam necessitatem. Amen.
